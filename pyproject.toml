[project]
name = "photoweb"
dynamic = ["version"]
authors = [
    {name="Mark Nottingham", email="mnot@mnot.net"}
]
description = "Templated HTML galleries based on in-photo metadata"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta"
]

dependencies = [
    "pillow",
    "jinja2",
    "defusedxml",
    "scikit-image",
    "numpy"
]

[project.optional-dependencies]
dev = ["mypy", "black", "isort", "pylint", "pytest", "pytest-md", "validate-pyproject", "build"]

[project.urls]
homepage = "https://github.com/mnot/photoweb"

[project.scripts]
photoweb = "photoweb.__main__:photoweb_cli"

[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "photoweb.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["photoweb", "photoweb.*"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
SHORTNAME = ["py.typed"]

